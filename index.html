<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#00ff55" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#252526" />
    <link rel="manifest" href="/manifest.json" />
    <!--seo-head-->
    <script>
      // Выставляет тему до первой отрисовки, чтобы не было вспышки неверной темы (FOUC).
      // Логика совпадает с getInitialDarkMode() в src/store/darkModeStore.ts.
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('darkMode');
          if (saved === 'light' || saved === 'dark') {
            theme = saved;
          }
        } catch (e) {
          // localStorage недоступен — остаётся тёмная тема по умолчанию
        }
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute('content', theme === 'dark' ? '#252526' : '#c1c1c1');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
